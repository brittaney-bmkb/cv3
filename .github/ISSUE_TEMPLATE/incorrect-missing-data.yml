name: Data Issue Form
description: File a report for missing or incorrect data.
title: "[Data Issue]: "
labels: ["data"]
projects: ["octo-org/1", "octo-org/44"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this data issue!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more information?
      placeholder: e.g., email@example.com
    validations:
      required: false
  - type: textarea
    id: issue-description
    attributes:
      label: Description
      description: Please describe the missing or incorrect data, including where it was encountered and its impact.
      placeholder: | 
        Go to '...'
        Click on '....'
        Scroll down to '....'
        See missing or incorrect data.
    validations:
      required: true
  - type: textarea
    id: expected-data
    attributes:
      label: Expected Data
      description: Describe what data you expected to see instead.
      placeholder: Describe the expected data here.
    validations:
      required: true
  - type: textarea
    id: screenshots-examples
    attributes:
      label: Screenshots/Examples
      description: Attach screenshots or provide examples to illustrate the issue.
      placeholder: Add screenshots or examples here.
    validations:
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Add any other context or relevant information about the missing or incorrect data.
      placeholder: Add additional information here.
    validations:
      required: false
