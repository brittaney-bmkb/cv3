name: Feature request form
description: Suggest an idea for this project
title: '[Feature Request]'
labels: 'enhancement'
body:
  - type: textarea
    id: related-problem
    attributes:
      label: Related Problem
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
  - type: textarea
    id: solution-description
    attributes:
      label: Solution Description
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternative-solutions
    attributes:
      label: Alternative Solutions
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Describe alternatives you've considered.
    validations:
      required: false
  - type: textarea
    id: other-solutions
    attributes:
      label: Other Solutions Examples
      description: Provide examples of other solutions you would like us to consider when developing the requested feature.
      placeholder: Include examples of other solutions you want us to consider.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
      placeholder: Add additional context here.
    validations:
      required: false
